info:
  name: Upload New File
  type: http
  seq: 11

http:
  method: POST
  url: "{{host}}/api/v1/file/upload/"
  headers:
    - name: Origin
      value: "{{host}}"
  body:
    type: multipart-form
    files:
      - name: file
        filePath: "./test-file.txt"
    form:
      - key: fileType
        value: "testTextFile"
        type: text
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
