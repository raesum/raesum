info:
  name: Signup
  type: http
  seq: 2

http:
  method: GET
  url: "{{host}}/api/v1/auth/signup?redirect_uri={{host}}/api/v1/auth/callbackSession"
  headers:
    - name: Origin
      value: "{{host}}"
  params:
    - name: redirect_uri
      value: "{{host}}/api/v1/auth/callbackSession"
      type: query
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
