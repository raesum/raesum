info:
  name: Set Activation
  type: http
  seq: 25

http:
  method: POST
  url: "{{host}}/api/v1/user/activation/set/1"
  headers:
    - name: Origin
      value: "{{host}}"
    - name: Authorization
      value: Bearer {{accessToken}}
    - name: Content-Type
      value: application/json
  body:
    type: json
    data: |-
      {
        "activeStatus": true
      }
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
