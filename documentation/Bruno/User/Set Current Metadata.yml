info:
  name: Set Current Metadata
  type: http
  seq: 22

http:
  method: POST
  url: "{{host}}/api/v1/user/metadata/set/byKey/family_name/"
  headers:
    - name: Origin
      value: "{{host}}"
    - name: Authorization
      value: Bearer {{accessToken}}
    - name: Content-Type
      value: application/json
  body:
    type: json
    data: |-
      {
        "value": "Vanir"
      }
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
