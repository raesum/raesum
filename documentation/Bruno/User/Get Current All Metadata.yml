info:
  name: Get Current All Metadata
  type: http
  seq: 17

http:
  method: GET
  url: "{{host}}/api/v1/user/metadata/get"
  headers:
    - name: Origin
      value: "{{host}}"
    - name: Authorization
      value: Bearer {{accessToken}}
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
