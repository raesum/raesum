info:
  name: Get User Roles
  type: http
  seq: 5

http:
  method: GET
  url: "{{host}}/api/v1/auth/role/user/get/"
  headers:
    - name: Origin
      value: "{{host}}"
    - name: Authorization
      value: Bearer {{accessToken}}
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
