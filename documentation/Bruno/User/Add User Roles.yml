info:
  name: Add User Roles
  type: http
  seq: 7

http:
  method: POST
  url: "{{host}}/api/v1/auth/role/user/add/"
  headers:
    - name: Origin
      value: "{{host}}"
    - name: Authorization
      value: Bearer {{accessToken}}
    - name: Content-Type
      value: application/json
  body:
    type: json
    data: |-
      {
        "values": [1, 2, "raesumOrgAdmin"]
      }
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
